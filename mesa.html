<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa — Shinobi no Sho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --bar-bg:#1c1c1e; --bg:#ffffff; --page-bg:#eef0f3;
    --gray-light:#f6f7f8; --gray-text:#8b8d92; --border:#e3e4e7; --border-strong:#d3d5d9;
    --input-bg:#f5f6f7; --input-border:#e2e3e6;
    --shadow: 0 1px 3px rgba(20,20,25,0.06), 0 8px 20px rgba(20,20,25,0.05);
    --radius:14px; --font-display:'Barlow Condensed', Arial, sans-serif; --font-body:'Inter', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ font-family:var(--font-body); background:var(--page-bg); color:var(--ink); }

  .topbar{
    background:var(--bar-bg); color:#fff; padding:14px 20px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px; position:relative; z-index:10;
  }
  .topbar .tt{ font-family:var(--font-display); font-size:19px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; }
  .topbar .sub{ font-size:11.5px; opacity:0.7; font-weight:600; }
  .sair{
    background:transparent; border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:999px;
    padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font-body);
  }
  .sair:hover{ background:rgba(255,255,255,0.12); }
  .btn-mapa{
    background:#0f4c9c; border:none; color:#fff; border-radius:999px;
    padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font-body);
  }
  .btn-mapa:hover{ filter:brightness(1.1); }
  .btn-mapa:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn-mapa.ativo{ background:#a32020; }
  .grid-ajuste{ display:flex; align-items:center; gap:6px; color:#fff; font-size:11.5px; font-weight:700; }
  .grid-ajuste input{
    width:56px; padding:5px 6px; border-radius:6px; border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.12); color:#fff; font-size:12px; font-weight:700; font-family:var(--font-body);
  }

  .presenca{ display:flex; align-items:center; gap:6px; }
  .avatar{
    width:28px; height:28px; border-radius:50%; background:#0f4c9c; color:#fff; font-weight:700;
    font-size:12px; display:flex; align-items:center; justify-content:center; border:2px solid var(--bar-bg);
    margin-left:-8px; font-family:var(--font-body); position:relative;
  }
  .avatar:first-child{ margin-left:0; }
  .avatar .tooltip{
    display:none; position:absolute; top:36px; left:50%; transform:translateX(-50%); background:#000;
    color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; font-weight:600;
  }
  .avatar:hover .tooltip{ display:block; }
  .contador-online{ font-size:11.5px; color:#fff; opacity:0.75; font-weight:600; margin-left:8px; }

  .palco{ position:relative; width:100%; height:calc(100% - 57px); overflow:hidden; touch-action:none; cursor:grab; }
  .palco.arrastando{ cursor:grabbing; }
  canvas{ display:block; }

  .estado-vazio{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;
    color:var(--gray-text); font-size:13.5px; padding:20px; max-width:320px;
  }
  .estado-vazio .grande{ font-family:var(--font-display); font-size:20px; color:var(--ink); font-weight:700; margin-bottom:6px; text-transform:uppercase; }

  .zoom-info{
    position:absolute; bottom:14px; right:14px; background:rgba(28,28,30,0.85); color:#fff; font-size:11px;
    font-weight:700; padding:6px 10px; border-radius:999px; pointer-events:none;
  }

  .icon-bar{
    position:absolute; top:0; left:0; bottom:0; width:52px; background:var(--bar-bg);
    display:flex; flex-direction:column; align-items:center; padding-top:14px; gap:8px; z-index:8;
  }
  .icon-bar button{
    width:38px; height:38px; border-radius:10px; background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; opacity:0.65;
  }
  .icon-bar button svg{ width:20px; height:20px; }
  .icon-bar button:hover{ opacity:0.9; background:rgba(255,255,255,0.08); }
  .icon-bar button.ativo{ opacity:1; background:rgba(255,255,255,0.16); }
  .icon-bar .swatch{
    width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,0.6);
    padding:0; opacity:1; background:#f1c40f;
  }
  .icon-bar .swatch:hover{ opacity:1; border-color:#fff; }
  .submenu-formas{ display:flex; flex-direction:column; gap:4px; }
  .submenu-formas .forma-btn{ width:32px; height:32px; border-radius:8px; }
  .submenu-formas .forma-btn svg{ width:16px; height:16px; }
  .submenu-formas .forma-btn.selecionada{ opacity:1; background:rgba(255,255,255,0.22); }

  .painel-dados{
    position:absolute; top:0; left:52px; bottom:0; width:300px; max-width:calc(100vw - 52px);
    background:var(--bg); border-right:1px solid var(--border); box-shadow:var(--shadow);
    display:none; flex-direction:column; overflow:hidden; z-index:7;
  }
  .painel-dados.aberto{ display:flex; }
  .painel-dados .cab{
    background:var(--bar-bg); color:#fff; padding:10px 12px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-display); text-transform:uppercase; font-weight:700; font-size:13px; letter-spacing:0.3px;
  }
  .painel-dados .cab button{ background:transparent; border:none; color:#fff; font-size:16px; cursor:pointer; line-height:1; }
  .painel-dados .form-rolagem{ padding:10px 12px; border-bottom:1px solid var(--border); display:flex; gap:6px; }
  .painel-dados .form-rolagem input{
    flex:1; padding:8px 10px; font-size:13px; font-family:var(--font-body);
    background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; color:var(--ink);
  }
  .painel-dados .form-rolagem button{
    background:#0f4c9c; border:none; color:#fff; border-radius:8px; padding:8px 14px; font-weight:700;
    font-size:13px; cursor:pointer; font-family:var(--font-body);
  }
  .atalhos{ padding:8px 12px; border-bottom:1px solid var(--border); display:flex; gap:6px; flex-wrap:wrap; }
  .atalhos button{
    background:var(--gray-light); border:1px solid var(--border-strong); border-radius:999px; padding:5px 11px;
    font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font-body); color:var(--ink);
  }
  .atalhos button:hover{ filter:brightness(0.97); }
  .log-rolagens{ flex:1; overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .log-item{ font-size:12.5px; line-height:1.4; }
  .log-item .quem{ font-weight:700; }
  .log-item .formula{ color:var(--gray-text); }
  .log-item .total{ font-weight:800; color:#0f4c9c; }
  .dados-visual{ display:inline-flex; align-items:center; gap:4px; margin:3px 6px 3px 0; vertical-align:middle; }
  .dado-cubo{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 3px;
    border-radius:5px; background:#eef4fc; border:1.5px solid #0f4c9c; color:#0f4c9c; font-size:11px; font-weight:800;
  }
  .modificador{ font-size:11.5px; color:var(--gray-text); font-weight:700; }
  .log-item.mensagem .quem{ color:#1c1c1e; }
  .log-item.mensagem .texto{ color:var(--ink); }
  .log-vazio{ color:var(--gray-text); font-size:12.5px; text-align:center; padding:14px 0; }

  .carta-rolagem{
    border:1px solid var(--border); border-left:3px solid #0f4c9c; border-radius:8px;
    padding:8px 10px; background:#fbfbfc;
  }
  .cr-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:3px; }
  .cr-titulo{
    font-family:var(--font-display); font-weight:800; font-size:13px; text-transform:uppercase;
    color:var(--ink); letter-spacing:0.2px;
  }
  .cr-quem{ font-size:10.5px; color:var(--gray-text); font-weight:700; white-space:nowrap; }
  .cr-linha{ display:flex; align-items:center; gap:6px; font-size:12.5px; padding:2px 0; flex-wrap:wrap; }
  .cr-etapa{ font-weight:700; color:var(--gray-text); min-width:44px; font-size:11.5px; }
  .cr-desc{ font-size:11.5px; color:var(--ink); opacity:0.8; margin:0 0 4px 50px; }
  .cr-badge{
    font-size:10px; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:999px; letter-spacing:0.2px;
  }
  .cr-badge.cr-fail{ background:#fdecec; color:#a32020; }
  .cr-badge.cr-crit{ background:#fff3cd; color:#8a6d00; }
  .cr-badge.cr-ok, .cr-badge.cr-g3, .cr-badge.cr-g4{ background:#e9f8ef; color:#0f7a3d; }
  .cr-badge.cr-g1, .cr-badge.cr-g2, .cr-badge.cr-ini{ background:#eef4fc; color:#0f4c9c; }
  .cr-badge.cr-default{ background:var(--gray-light); color:var(--ink); }

  .item-iniciativa{ display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .item-iniciativa:last-child{ border-bottom:none; }
  .item-iniciativa.atual{ background:#fff6d8; border-radius:8px; }
  .item-iniciativa .pos{ width:18px; color:var(--gray-text); font-weight:700; font-size:11px; flex-shrink:0; }
  .item-iniciativa .nome{ flex:1; font-weight:600; }
  .item-iniciativa .valor{ font-weight:800; color:#0f4c9c; min-width:24px; text-align:right; }
  .item-iniciativa .remover-iniciativa{
    background:transparent; border:none; color:#a32020; cursor:pointer; font-size:13px; padding:2px 4px;
  }

  .item-mapa{ display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .item-mapa:last-child{ border-bottom:none; }
  .item-mapa.ativo{ background:#e9f2fe; border-radius:8px; }
  .item-mapa .nome-mapa{ flex:1; font-weight:600; }
  .item-mapa .ativar-mapa{
    font-size:11px; font-weight:700; border-radius:999px; padding:5px 11px; cursor:pointer;
    border:1px solid var(--border-strong); background:var(--gray-light); color:var(--ink); font-family:var(--font-body);
  }
  .item-mapa .tag-ativo{ font-size:10.5px; font-weight:800; color:#0f4c9c; text-transform:uppercase; }
  .item-mapa .apagar-mapa{ background:transparent; border:none; color:#a32020; cursor:pointer; font-size:14px; padding:2px 4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <div class="tt" id="nome_sala">Carregando…</div>
    <div class="sub" id="sub_sala">&nbsp;</div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="presenca" id="area_presenca"></div>
    <button class="btn-mapa" id="btn_add_token" style="display:none;">+ Token</button>
    <div class="grid-ajuste" id="grid_ajuste" style="display:none;">
      <label for="in_grid_px">Grid</label>
      <input type="number" id="in_grid_px" min="10" max="500" step="1">
    </div>
    <button class="btn-mapa" id="btn_fog_revelar" style="display:none;">Revelar</button>
    <button class="btn-mapa" id="btn_fog_esconder" style="display:none;">Esconder</button>
    <input type="file" id="input_mapa" accept="image/*" style="display:none;">
    <button class="sair" id="btn_sair">Sair</button>
  </div>
</div>

<div class="palco" id="palco">
  <canvas id="mapa"></canvas>
  <div class="estado-vazio" id="estado_vazio" style="display:none;">
    <div class="grande">Sem mapa ainda</div>
    <div id="estado_vazio_texto">Aguardando o mestre subir um mapa.</div>
  </div>
  <div class="zoom-info" id="zoom_info" style="display:none;"></div>

  <div class="icon-bar">
    <button type="button" class="btn-painel" id="btn_dados_toggle" title="Chat e dados">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="3"></rect>
        <circle cx="8.5" cy="8.5" r="1"></circle>
        <circle cx="15.5" cy="15.5" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
      </svg>
    </button>
    <button type="button" class="btn-painel" id="btn_iniciativa_toggle" title="Iniciativa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="14" y2="18"></line>
      </svg>
    </button>
    <button type="button" class="btn-painel" id="btn_mapas_toggle" title="Mapas" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4 L3 6 L3 20 L9 18 L15 20 L21 18 L21 4 L15 6 L9 4 Z"></path>
        <line x1="9" y1="4" x2="9" y2="18"></line>
        <line x1="15" y1="6" x2="15" y2="20"></line>
      </svg>
    </button>
    <button type="button" id="btn_ping_toggle" title="Ping no mapa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
    <button type="button" id="btn_cor_ping" class="swatch" title="Cor do seu ping"></button>
    <input type="color" id="input_cor_ping" style="display:none;" value="#f1c40f">
    <button type="button" id="btn_medir_toggle" title="Medir / Área">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="6" rx="1" transform="rotate(-45 12 12)"></rect>
        <line x1="8" y1="8" x2="10" y2="10" transform="rotate(-45 12 12)"></line>
        <line x1="12" y1="8" x2="14" y2="10" transform="rotate(-45 12 12)"></line>
        <line x1="16" y1="8" x2="18" y2="10" transform="rotate(-45 12 12)"></line>
      </svg>
    </button>
    <div class="submenu-formas" id="submenu_formas" style="display:none;">
      <button type="button" class="forma-btn selecionada" data-forma="linha" title="Linha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
      </button>
      <button type="button" class="forma-btn" data-forma="cone" title="Cone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4 L20 20 L4 20 Z"></path></svg>
      </button>
      <button type="button" class="forma-btn" data-forma="circulo" title="Círculo / Esfera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle></svg>
      </button>
      <button type="button" class="forma-btn" data-forma="quadrado" title="Quadrado / Cubo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14"></rect></svg>
      </button>
    </div>
    <button type="button" id="btn_cursor_toggle" title="Mostrar meu cursor pros jogadores" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51z"></path>
      </svg>
    </button>
  </div>
  <div class="painel-dados" id="painel_dados">
    <div class="cab">
      <span>Mesa</span>
      <button type="button" id="btn_fechar_dados">✕</button>
    </div>
    <div class="atalhos">
      <button type="button" data-f="1d4">d4</button>
      <button type="button" data-f="1d6">d6</button>
      <button type="button" data-f="1d8">d8</button>
      <button type="button" data-f="1d10">d10</button>
      <button type="button" data-f="1d12">d12</button>
      <button type="button" data-f="1d20">d20</button>
      <button type="button" data-f="1d100">d100</button>
    </div>
    <div class="log-rolagens" id="log_rolagens">
      <div class="log-vazio">Nenhuma atividade ainda.</div>
    </div>
    <div class="form-rolagem">
      <input type="text" id="in_mensagem" placeholder="Mensagem… ou /r 1d20" maxlength="500">
      <button type="button" id="btn_enviar_msg">Enviar</button>
    </div>
  </div>

  <div class="painel-dados" id="painel_iniciativa">
    <div class="cab">
      <span>Iniciativa</span>
      <button type="button" id="btn_fechar_iniciativa">✕</button>
    </div>
    <div class="log-rolagens" id="lista_iniciativa">
      <div class="log-vazio">Ninguém na lista ainda.</div>
    </div>
    <div class="form-rolagem" id="form_add_iniciativa" style="display:none;">
      <input type="text" id="in_nome_iniciativa" placeholder="Nome" style="flex:2;">
      <input type="number" id="in_valor_iniciativa" placeholder="Valor" style="flex:1; min-width:0;">
      <button type="button" id="btn_add_iniciativa">+</button>
    </div>
    <div class="form-rolagem" id="controles_iniciativa" style="display:none;">
      <button type="button" id="btn_iniciativa_avancar" style="flex:1;">Avançar vez</button>
      <button type="button" id="btn_iniciativa_limpar" style="flex:1; background:#a32020;">Limpar</button>
    </div>
  </div>

  <div class="painel-dados" id="painel_mapas">
    <div class="cab">
      <span>Mapas</span>
      <button type="button" id="btn_fechar_mapas">✕</button>
    </div>
    <div class="form-rolagem">
      <button type="button" id="btn_novo_mapa" style="flex:1;">+ Novo mapa</button>
    </div>
    <div class="log-rolagens" id="lista_mapas">
      <div class="log-vazio">Nenhum mapa salvo ainda.</div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const salaId = params.get("sala");

let meuId = null, meuNome = "";
let salaAtual = null, cenaAtual = null;
let canal = null;

let mapaImg = null;
let cam = { x: 0, y: 0, escala: 1 }; // x,y = deslocamento em pixels de tela; escala = zoom
let tokensAtuais = [];
const paletaCores = ["#c0392b","#2980b9","#27ae60","#f39c12","#8e44ad","#16a085","#d35400","#2c3e50"];
let fogRevelado = new Set();
let modoFog = null; // null | "revelar" | "esconder"
let selecaoFog = null;
let modoPing = false;
let espacoPressionado = false;
let pingsAtivos = [];
let animandoPings = false;
let cursorMestre = null;
let ultimoEnvioCursorMs = 0;
let meuCor = "#f1c40f";
let compartilharCursor = false;
let iniciativaOrdem = [];
let iniciativaAtual = 0;
let modoMedir = false;
let formaSelecionada = "linha"; // "linha" | "cone" | "circulo" | "quadrado"
let formaAtiva = null;
const METROS_POR_CASA = 1.5;

function souMestreDaSala(){
  return !!salaAtual && salaAtual.mestre_id === meuId;
}

const canvas = document.getElementById("mapa");
const ctx = canvas.getContext("2d");
const palco = document.getElementById("palco");

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iniciais(nome){
  const p = (nome || "?").trim().split(/\s+/);
  return ((p[0]||"")[0] || "?").toUpperCase() + ((p[1]||"")[0] || "").toUpperCase();
}

async function iniciar(){
  if(!salaId){ alert("Sala não informada na URL."); location.href = "home.html"; return; }

  const { data: sess } = await sb.auth.getSession();
  if(!sess.session){ location.href = "index.html"; return; }
  meuId = sess.session.user.id;

  const { data: perfil } = await sb.from("perfis").select("nome, cor").eq("id", meuId).single();
  meuNome = (perfil && perfil.nome) || sess.session.user.email || "Jogador";
  meuCor = (perfil && perfil.cor) || "#f1c40f";
  document.getElementById("btn_cor_ping").style.background = meuCor;
  document.getElementById("input_cor_ping").value = meuCor;

  const { data: sala, error: errSala } = await sb.from("salas").select("*").eq("id", salaId).single();
  if(errSala || !sala){
    alert("Não foi possível abrir essa sala (ela não existe ou você não tem acesso).");
    location.href = "home.html";
    return;
  }
  salaAtual = sala;
  document.getElementById("nome_sala").textContent = sala.nome;
  if(sala.mestre_id === meuId){
    document.getElementById("btn_add_token").style.display = "inline-block";
    document.getElementById("grid_ajuste").style.display = "flex";
    document.getElementById("btn_mapas_toggle").style.display = "inline-flex";
    document.getElementById("btn_fog_revelar").style.display = "inline-block";
    document.getElementById("btn_fog_esconder").style.display = "inline-block";
    document.getElementById("btn_cursor_toggle").style.display = "inline-flex";
    document.getElementById("form_add_iniciativa").style.display = "flex";
    document.getElementById("controles_iniciativa").style.display = "flex";
  }

  if(sala.cena_ativa){
    const { data: cena } = await sb.from("cenas").select("*").eq("id", sala.cena_ativa).single();
    cenaAtual = cena || null;
  }
  if(cenaAtual) await carregarTokens();
  await carregarFog();
  await carregarIniciativa();
  await carregarFeed();
  atualizarSub();
  prepararCanvas();
  carregarMapa();

  conectarPresenca();
}

function atualizarSub(){
  document.getElementById("sub_sala").textContent = cenaAtual ? cenaAtual.nome : "Nenhuma cena ativa";
  const inGrid = document.getElementById("in_grid_px");
  if(inGrid) inGrid.value = cenaAtual ? (cenaAtual.grid_px || 70) : 70;
}

/* ===== Canvas: mapa + zoom + pan ===== */

function prepararCanvas(){
  redimensionar();
  window.addEventListener("resize", redimensionar);

  let arrastandoMapa = false;
  let tokenArrastando = null;
  let ultimoX = 0, ultimoY = 0;

  palco.addEventListener("pointerdown", (e) => {
    if(e.target.closest("button, input, .painel-dados, .icon-bar")) return;

    const rect = palco.getBoundingClientRect();

    if(modoFog){
      selecaoFog = { x0: e.clientX - rect.left, y0: e.clientY - rect.top, x1: e.clientX - rect.left, y1: e.clientY - rect.top };
      palco.setPointerCapture(e.pointerId);
      return;
    }

    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;

    if(modoMedir){
      const mapX0 = (cx - cam.x) / cam.escala, mapY0 = (cy - cam.y) / cam.escala;
      formaAtiva = { x0: mapX0, y0: mapY0, x1: mapX0, y1: mapY0 };
      palco.setPointerCapture(e.pointerId);
      return;
    }

    if(modoPing || espacoPressionado){
      const mapX = (cx - cam.x) / cam.escala;
      const mapY = (cy - cam.y) / cam.escala;
      dispararPing(mapX, mapY);
      return;
    }

    const alvo = encontrarTokenEm(cx, cy);

    if(alvo && podeArrastarToken(alvo)){
      tokenArrastando = alvo;
      palco.setPointerCapture(e.pointerId);
      return;
    }

    arrastandoMapa = true;
    ultimoX = e.clientX; ultimoY = e.clientY;
    palco.classList.add("arrastando");
    palco.setPointerCapture(e.pointerId);
  });

  palco.addEventListener("pointermove", (e) => {
    const rect = palco.getBoundingClientRect();
    const cx0 = e.clientX - rect.left, cy0 = e.clientY - rect.top;
    if(souMestreDaSala() && compartilharCursor){
      enviarCursorMestre((cx0 - cam.x) / cam.escala, (cy0 - cam.y) / cam.escala);
    }

    if(selecaoFog){
      selecaoFog.x1 = cx0;
      selecaoFog.y1 = cy0;
      desenhar();
      return;
    }
    if(formaAtiva){
      formaAtiva.x1 = (cx0 - cam.x) / cam.escala;
      formaAtiva.y1 = (cy0 - cam.y) / cam.escala;
      desenhar();
      return;
    }
    if(tokenArrastando){
      const cx = cx0, cy = cy0;
      tokenArrastando.x = (cx - cam.x) / cam.escala;
      tokenArrastando.y = (cy - cam.y) / cam.escala;
      desenhar();
      enviarMovimentoToken(tokenArrastando);
      return;
    }
    if(!arrastandoMapa) return;
    cam.x += e.clientX - ultimoX;
    cam.y += e.clientY - ultimoY;
    ultimoX = e.clientX; ultimoY = e.clientY;
    desenhar();
  });

  function soltar(e){
    if(formaAtiva){
      formaAtiva = null;
      desenhar();
      return;
    }
    if(selecaoFog){
      aplicarSelecaoFog();
      selecaoFog = null;
      desenhar();
      return;
    }
    if(tokenArrastando){
      const gridPx = cenaAtual.grid_px || 70;
      tokenArrastando.x = Math.round((tokenArrastando.x - gridPx / 2) / gridPx) * gridPx + gridPx / 2;
      tokenArrastando.y = Math.round((tokenArrastando.y - gridPx / 2) / gridPx) * gridPx + gridPx / 2;
      desenhar();
      salvarPosicaoToken(tokenArrastando);
      tokenArrastando = null;
      return;
    }
    arrastandoMapa = false;
    palco.classList.remove("arrastando");
  }
  palco.addEventListener("pointerup", soltar);
  palco.addEventListener("pointercancel", soltar);
  palco.addEventListener("pointerleave", soltar);

  palco.addEventListener("wheel", (e) => {
    e.preventDefault();
    const fator = e.deltaY < 0 ? 1.1 : 0.9;
    zoomEm(e.clientX, e.clientY, fator);
  }, { passive:false });

  mostrarZoomInfo();
}

document.addEventListener("keydown", (e) => {
  if(e.code !== "Space") return;
  const alvo = e.target;
  if(alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA")) return;
  espacoPressionado = true;
  e.preventDefault();
});
document.addEventListener("keyup", (e) => {
  if(e.code === "Space") espacoPressionado = false;
});

function redimensionar(){
  canvas.width = palco.clientWidth;
  canvas.height = palco.clientHeight;
  desenhar();
}

function zoomEm(clientX, clientY, fator){
  const rect = palco.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  const novaEscala = Math.min(4, Math.max(0.2, cam.escala * fator));
  const fatorReal = novaEscala / cam.escala;
  cam.x = px - (px - cam.x) * fatorReal;
  cam.y = py - (py - cam.y) * fatorReal;
  cam.escala = novaEscala;
  desenhar();
  mostrarZoomInfo();
}

function mostrarZoomInfo(){
  const el = document.getElementById("zoom_info");
  if(!mapaImg){ el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = Math.round(cam.escala * 100) + "%";
}

function centralizarMapa(){
  if(!mapaImg) return;
  cam.escala = Math.min(canvas.width / mapaImg.width, canvas.height / mapaImg.height, 1);
  cam.x = (canvas.width - mapaImg.width * cam.escala) / 2;
  cam.y = (canvas.height - mapaImg.height * cam.escala) / 2;
}

function desenhar(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#cfd2d8";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if(mapaImg){
    ctx.drawImage(mapaImg, cam.x, cam.y, mapaImg.width * cam.escala, mapaImg.height * cam.escala);
  }
  if(cenaAtual) desenharGrid();
  desenharTokens();
  if(cenaAtual) desenharFog();
  desenharSelecaoFog();
  desenharPings();
  desenharCursorMestre();
  desenharFormaMedicao();
}

function desenharGrid(){
  const gridPx = (cenaAtual.grid_px || 70) * cam.escala;
  if(gridPx < 6) return;
  ctx.strokeStyle = "rgba(0,0,0,0.18)";
  ctx.lineWidth = 1;
  const offsetX = cam.x % gridPx;
  const offsetY = cam.y % gridPx;
  ctx.beginPath();
  for(let x = offsetX; x < canvas.width; x += gridPx){
    ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
  }
  for(let y = offsetY; y < canvas.height; y += gridPx){
    ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
  }
  ctx.stroke();
}

function desenharTokens(){
  const gridPx = cenaAtual ? (cenaAtual.grid_px || 70) : 70;
  tokensAtuais.forEach(t => {
    const sx = cam.x + t.x * cam.escala;
    const sy = cam.y + t.y * cam.escala;
    const raio = (gridPx / 2) * 0.8 * cam.escala * (t.tam || 1);

    ctx.beginPath();
    ctx.arc(sx, sy, raio, 0, Math.PI * 2);
    ctx.fillStyle = t.cor || "#555";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    ctx.font = "600 11px Inter, Arial, sans-serif";
    ctx.textAlign = "center";
    const texto = t.nome || "";
    const ty = sy + raio + 13;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.strokeText(texto, sx, ty);
    ctx.fillStyle = "#1a1a1a";
    ctx.fillText(texto, sx, ty);
  });
}

async function carregarMapa(){
  const vazio = document.getElementById("estado_vazio");
  if(!cenaAtual || !cenaAtual.mapa_url){
    vazio.style.display = "block";
    document.getElementById("estado_vazio_texto").textContent = cenaAtual
      ? "Esta cena ainda não tem um mapa."
      : "Aguardando o mestre criar uma cena e subir um mapa.";
    mapaImg = null;
    desenhar();
    mostrarZoomInfo();
    return;
  }

  /* bucket "mapas" é privado: baixamos com o client autenticado (RLS libera pra membros) */
  const { data: blob, error } = await sb.storage.from("mapas").download(cenaAtual.mapa_url);
  if(error || !blob){
    vazio.style.display = "block";
    document.getElementById("estado_vazio_texto").textContent = "Não foi possível carregar a imagem do mapa.";
    return;
  }
  vazio.style.display = "none";
  const objectUrl = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    mapaImg = img;
    centralizarMapa();
    desenhar();
    mostrarZoomInfo();
    URL.revokeObjectURL(objectUrl);
  };
  img.onerror = () => {
    vazio.style.display = "block";
    document.getElementById("estado_vazio_texto").textContent = "Não foi possível carregar a imagem do mapa.";
  };
  img.src = objectUrl;
}

/* ===== Tokens ===== */

let ultimoEnvioMoveMs = 0;

function encontrarTokenEm(clickX, clickY){
  const gridPx = cenaAtual ? (cenaAtual.grid_px || 70) : 70;
  for(let i = tokensAtuais.length - 1; i >= 0; i--){
    const t = tokensAtuais[i];
    const sx = cam.x + t.x * cam.escala;
    const sy = cam.y + t.y * cam.escala;
    const raio = (gridPx / 2) * 0.8 * cam.escala * (t.tam || 1);
    const dx = clickX - sx, dy = clickY - sy;
    if(dx * dx + dy * dy <= raio * raio) return t;
  }
  return null;
}

function podeArrastarToken(t){
  return !!salaAtual && (salaAtual.mestre_id === meuId || t.dono_id === meuId);
}

function enviarMovimentoToken(t){
  const agora = Date.now();
  if(agora - ultimoEnvioMoveMs < 40) return; /* limita a ~25 envios/seg */
  ultimoEnvioMoveMs = agora;
  if(canal) canal.send({ type: "broadcast", event: "mover_token", payload: { id: t.id, x: t.x, y: t.y } });
}

async function salvarPosicaoToken(t){
  const { error } = await sb.from("tokens").update({ x: t.x, y: t.y }).eq("id", t.id);
  if(error) alert("Não foi possível salvar a posição do token: " + error.message);
}

async function carregarTokens(){
  if(!cenaAtual){ tokensAtuais = []; return; }
  const { data, error } = await sb.from("tokens").select("*").eq("cena_id", cenaAtual.id);
  tokensAtuais = error ? [] : (data || []);
  desenhar();
}

document.getElementById("btn_add_token").addEventListener("click", criarToken);

async function criarToken(){
  if(!cenaAtual){ alert("Suba um mapa antes de adicionar tokens (crie a cena primeiro)."); return; }

  const nome = prompt("Nome do token:", "Novo token");
  if(nome == null) return;

  const { data: membros } = await sb.from("sala_membros").select("user_id").eq("sala_id", salaId);
  let donoId = null;
  if(membros && membros.length){
    const ids = membros.map(m => m.user_id);
    const { data: perfisMembros } = await sb.from("perfis").select("id, nome").in("id", ids);
    if(perfisMembros && perfisMembros.length){
      let listaTexto = "Atribuir a qual jogador? Digite o número (ou deixe em branco pra não atribuir):\n";
      perfisMembros.forEach((p, i) => { listaTexto += (i + 1) + ". " + p.nome + "\n"; });
      const escolha = prompt(listaTexto);
      if(escolha){
        const idx = parseInt(escolha, 10) - 1;
        if(perfisMembros[idx]) donoId = perfisMembros[idx].id;
      }
    }
  }

  const gridPx = cenaAtual.grid_px || 70;
  const mapX = (canvas.width / 2 - cam.x) / cam.escala;
  const mapY = (canvas.height / 2 - cam.y) / cam.escala;
  const x = Math.round(mapX / gridPx) * gridPx + gridPx / 2;
  const y = Math.round(mapY / gridPx) * gridPx + gridPx / 2;
  const cor = paletaCores[tokensAtuais.length % paletaCores.length];

  const { error } = await sb.from("tokens").insert({
    cena_id: cenaAtual.id, dono_id: donoId, nome: nome.trim() || "Token", x, y, cor
  });
  if(error) alert("Não foi possível criar o token: " + error.message);
}

/* ===== Névoa de guerra ===== */

async function carregarFog(){
  fogRevelado = new Set();
  if(!cenaAtual) return;
  const { data } = await sb.from("fog").select("revelado").eq("cena_id", cenaAtual.id).single();
  if(data && Array.isArray(data.revelado)){
    data.revelado.forEach(par => fogRevelado.add(par[0] + "," + par[1]));
  }
}

async function salvarFog(){
  if(!cenaAtual) return;
  const lista = Array.from(fogRevelado).map(chave => chave.split(",").map(Number));
  const { error } = await sb.from("fog").upsert({ cena_id: cenaAtual.id, revelado: lista }, { onConflict: "cena_id" });
  if(error) alert("Não foi possível salvar a névoa: " + error.message);
}

function aplicarSelecaoFog(){
  if(!selecaoFog || !cenaAtual) return;
  const gridPx = cenaAtual.grid_px || 70;
  const cellScreen = gridPx * cam.escala;
  if(cellScreen <= 0) return;

  const sxMin = Math.min(selecaoFog.x0, selecaoFog.x1);
  const sxMax = Math.max(selecaoFog.x0, selecaoFog.x1);
  const syMin = Math.min(selecaoFog.y0, selecaoFog.y1);
  const syMax = Math.max(selecaoFog.y0, selecaoFog.y1);

  const gxIni = Math.floor((sxMin - cam.x) / cellScreen);
  const gxFim = Math.floor((sxMax - cam.x) / cellScreen);
  const gyIni = Math.floor((syMin - cam.y) / cellScreen);
  const gyFim = Math.floor((syMax - cam.y) / cellScreen);

  for(let gx = gxIni; gx <= gxFim; gx++){
    for(let gy = gyIni; gy <= gyFim; gy++){
      const chave = gx + "," + gy;
      if(modoFog === "revelar") fogRevelado.add(chave);
      else fogRevelado.delete(chave);
    }
  }
  salvarFog();
}

function desenharFog(){
  const gridPx = cenaAtual.grid_px || 70;
  const cellScreen = gridPx * cam.escala;
  if(cellScreen < 2) return;
  const souMestre = !!salaAtual && salaAtual.mestre_id === meuId;

  const gxIni = Math.floor(-cam.x / cellScreen) - 1;
  const gxFim = Math.ceil((canvas.width - cam.x) / cellScreen) + 1;
  const gyIni = Math.floor(-cam.y / cellScreen) - 1;
  const gyFim = Math.ceil((canvas.height - cam.y) / cellScreen) + 1;

  ctx.fillStyle = souMestre ? "rgba(0,0,0,0.45)" : "#000";
  for(let gx = gxIni; gx <= gxFim; gx++){
    for(let gy = gyIni; gy <= gyFim; gy++){
      if(fogRevelado.has(gx + "," + gy)) continue;
      const sx = cam.x + gx * cellScreen;
      const sy = cam.y + gy * cellScreen;
      ctx.fillRect(sx, sy, cellScreen + 1, cellScreen + 1);
    }
  }
}

function desenharSelecaoFog(){
  if(!selecaoFog) return;
  const x = Math.min(selecaoFog.x0, selecaoFog.x1);
  const y = Math.min(selecaoFog.y0, selecaoFog.y1);
  const w = Math.abs(selecaoFog.x1 - selecaoFog.x0);
  const h = Math.abs(selecaoFog.y1 - selecaoFog.y0);
  ctx.fillStyle = modoFog === "revelar" ? "rgba(39,174,96,0.25)" : "rgba(192,57,43,0.25)";
  ctx.strokeStyle = modoFog === "revelar" ? "#27ae60" : "#c0392b";
  ctx.lineWidth = 2;
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
}

function setModoFog(modo){
  modoFog = (modoFog === modo) ? null : modo;
  document.getElementById("btn_fog_revelar").classList.toggle("ativo", modoFog === "revelar");
  document.getElementById("btn_fog_esconder").classList.toggle("ativo", modoFog === "esconder");
}
document.getElementById("btn_fog_revelar").addEventListener("click", () => setModoFog("revelar"));
document.getElementById("btn_fog_esconder").addEventListener("click", () => setModoFog("esconder"));

/* ===== Pings e cursor do mestre ===== */

function dispararPing(mapX, mapY){
  adicionarPing(mapX, mapY, meuCor);
  if(canal) canal.send({ type: "broadcast", event: "ping", payload: { x: mapX, y: mapY, cor: meuCor } });
}

function adicionarPing(mapX, mapY, cor){
  pingsAtivos.push({ x: mapX, y: mapY, inicio: Date.now(), cor: cor || "#f1c40f" });
  if(!animandoPings){
    animandoPings = true;
    requestAnimationFrame(loopPings);
  }
}

function loopPings(){
  const agora = Date.now();
  pingsAtivos = pingsAtivos.filter(p => agora - p.inicio < 2000);
  desenhar();
  if(pingsAtivos.length > 0){
    requestAnimationFrame(loopPings);
  } else {
    animandoPings = false;
  }
}

function hexParaRgba(hex, alpha){
  let h = (hex || "#f1c40f").replace("#", "");
  if(h.length === 3) h = h.split("").map(c => c + c).join("");
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return "rgba(" + r + "," + g + "," + b + "," + alpha.toFixed(2) + ")";
}

function desenharPings(){
  if(!pingsAtivos.length) return;
  const agora = Date.now();
  pingsAtivos.forEach(p => {
    const t = Math.min(1, (agora - p.inicio) / 2000);
    const sx = cam.x + p.x * cam.escala;
    const sy = cam.y + p.y * cam.escala;
    const raio = 10 + t * 46;
    ctx.beginPath();
    ctx.arc(sx, sy, raio, 0, Math.PI * 2);
    ctx.strokeStyle = hexParaRgba(p.cor, 1 - t);
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fillStyle = hexParaRgba(p.cor, 1 - t * 0.5);
    ctx.fill();
  });
}

function enviarCursorMestre(mapX, mapY){
  const agora = Date.now();
  if(agora - ultimoEnvioCursorMs < 60) return;
  ultimoEnvioCursorMs = agora;
  if(canal) canal.send({ type: "broadcast", event: "cursor_mestre", payload: { x: mapX, y: mapY } });
}

function desenharCursorMestre(){
  if(!cursorMestre || souMestreDaSala()) return;
  const sx = cam.x + cursorMestre.x * cam.escala;
  const sy = cam.y + cursorMestre.y * cam.escala;
  ctx.beginPath();
  ctx.arc(sx, sy, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#0f4c9c";
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#fff";
  ctx.stroke();
  ctx.font = "600 10px Inter, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#0f4c9c";
  ctx.fillText("Mestre", sx, sy - 11);
}

function desenharFormaMedicao(){
  if(!formaAtiva) return;
  const gridPx = cenaAtual ? (cenaAtual.grid_px || 70) : 70;
  const dx = formaAtiva.x1 - formaAtiva.x0, dy = formaAtiva.y1 - formaAtiva.y0;
  const distPx = Math.hypot(dx, dy);
  const casas = distPx / gridPx;
  const metros = casas * METROS_POR_CASA;

  const s0x = cam.x + formaAtiva.x0 * cam.escala, s0y = cam.y + formaAtiva.y0 * cam.escala;
  const s1x = cam.x + formaAtiva.x1 * cam.escala, s1y = cam.y + formaAtiva.y1 * cam.escala;

  ctx.save();
  ctx.fillStyle = "rgba(15,76,156,0.22)";
  ctx.strokeStyle = "#0f4c9c";
  ctx.lineWidth = 2;

  let rotulo = casas.toFixed(1) + " casas (~" + metros.toFixed(1) + "m)";

  if(formaSelecionada === "linha"){
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(s0x, s0y);
    ctx.lineTo(s1x, s1y);
    ctx.stroke();
    ctx.setLineDash([]);
    [[s0x, s0y], [s1x, s1y]].forEach(([px, py]) => {
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#0f4c9c";
      ctx.fill();
    });
  } else if(formaSelecionada === "circulo"){
    const raioTela = distPx * cam.escala;
    ctx.beginPath();
    ctx.arc(s0x, s0y, raioTela, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    rotulo = "raio " + rotulo;
  } else if(formaSelecionada === "quadrado"){
    const lado = Math.max(Math.abs(dx), Math.abs(dy));
    const ladoTela = lado * cam.escala;
    const sinalX = dx < 0 ? -1 : 1, sinalY = dy < 0 ? -1 : 1;
    ctx.beginPath();
    ctx.rect(s0x, s0y, ladoTela * sinalX, ladoTela * sinalY);
    ctx.fill();
    ctx.stroke();
    const casasLado = lado / gridPx;
    rotulo = casasLado.toFixed(1) + " casas de lado (~" + (casasLado * METROS_POR_CASA).toFixed(1) + "m)";
  } else if(formaSelecionada === "cone"){
    const anguloBase = Math.atan2(dy, dx);
    const abertura = (55 * Math.PI / 180) / 2;
    const comp = distPx * cam.escala;
    ctx.beginPath();
    ctx.moveTo(s0x, s0y);
    ctx.arc(s0x, s0y, comp, anguloBase - abertura, anguloBase + abertura);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  const mx = (s0x + s1x) / 2, my = (s0y + s1y) / 2;
  ctx.font = "700 12px Inter, Arial, sans-serif";
  const largura = ctx.measureText(rotulo).width;
  ctx.fillStyle = "rgba(15,76,156,0.92)";
  ctx.fillRect(mx - largura / 2 - 6, my - 22, largura + 12, 20);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText(rotulo, mx, my - 8);
}

async function carregarIniciativa(){
  const { data } = await sb.from("iniciativa").select("*").eq("sala_id", salaId).single();
  iniciativaOrdem = (data && Array.isArray(data.ordem)) ? data.ordem : [];
  iniciativaAtual = (data && typeof data.atual === "number") ? data.atual : 0;
  renderizarIniciativa();
}

async function salvarIniciativa(){
  const { error } = await sb.from("iniciativa")
    .upsert({ sala_id: salaId, ordem: iniciativaOrdem, atual: iniciativaAtual }, { onConflict: "sala_id" });
  if(error) alert("Não foi possível salvar a iniciativa: " + error.message);
}

function renderizarIniciativa(){
  const area = document.getElementById("lista_iniciativa");
  if(!iniciativaOrdem.length){ area.innerHTML = '<div class="log-vazio">Ninguém na lista ainda.</div>'; return; }
  area.innerHTML = iniciativaOrdem.map((item, i) => {
    const ehAtual = i === iniciativaAtual;
    return '<div class="item-iniciativa' + (ehAtual ? " atual" : "") + '" data-idx="' + i + '">' +
      '<span class="pos">' + (i + 1) + 'º</span>' +
      '<span class="nome">' + escapeHtml(item.nome) + '</span>' +
      '<span class="valor">' + item.valor + '</span>' +
      (souMestreDaSala() ? '<button type="button" class="remover-iniciativa" data-idx="' + i + '">✕</button>' : '') +
    '</div>';
  }).join("");

  if(souMestreDaSala()){
    area.querySelectorAll(".remover-iniciativa").forEach(btn => {
      btn.addEventListener("click", () => removerIniciativa(parseInt(btn.dataset.idx, 10)));
    });
  }
}

function ordenarIniciativa(){
  let atualRef = iniciativaOrdem[iniciativaAtual];
  iniciativaOrdem.sort((a, b) => b.valor - a.valor);
  if(atualRef){
    const novoIdx = iniciativaOrdem.indexOf(atualRef);
    iniciativaAtual = novoIdx >= 0 ? novoIdx : 0;
  }
}

document.getElementById("btn_add_iniciativa").addEventListener("click", async () => {
  const inNome = document.getElementById("in_nome_iniciativa");
  const inValor = document.getElementById("in_valor_iniciativa");
  const nome = inNome.value.trim();
  const valor = parseInt(inValor.value, 10);
  if(!nome || isNaN(valor)) return;

  iniciativaOrdem.push({ nome, valor });
  ordenarIniciativa();
  renderizarIniciativa();
  await salvarIniciativa();
  inNome.value = "";
  inValor.value = "";
  inNome.focus();
});

async function removerIniciativa(idx){
  iniciativaOrdem.splice(idx, 1);
  if(iniciativaAtual >= iniciativaOrdem.length) iniciativaAtual = 0;
  renderizarIniciativa();
  await salvarIniciativa();
}

document.getElementById("btn_iniciativa_avancar").addEventListener("click", async () => {
  if(!iniciativaOrdem.length) return;
  iniciativaAtual = (iniciativaAtual + 1) % iniciativaOrdem.length;
  renderizarIniciativa();
  await salvarIniciativa();
});

document.getElementById("btn_iniciativa_limpar").addEventListener("click", async () => {
  if(!confirm("Limpar toda a lista de iniciativa?")) return;
  iniciativaOrdem = [];
  iniciativaAtual = 0;
  renderizarIniciativa();
  await salvarIniciativa();
});

/* ===== Dados (rolagens) + Chat (mensagens), num feed único ===== */

let feedEventos = [];
let nomesCache = {};

const ROTULO_ETAPA = { ataque:"Ataque", dano:"Dano", defesa:"Defesa", manobra:"Manobra", teste:"Teste", uso:"Uso", iniciativa:"Iniciativa" };

async function nomeDoUsuario(uid){
  if(nomesCache[uid]) return nomesCache[uid];
  const { data } = await sb.from("perfis").select("nome").eq("id", uid).single();
  const nome = (data && data.nome) || "Jogador";
  nomesCache[uid] = nome;
  return nome;
}

function parteDeLinha(row){
  const r = row.resultado || {};
  return {
    etapa: r.etapa || null,
    formula: row.formula,
    dados: Array.isArray(r.dados) ? r.dados : [],
    modificador: r.modificador || 0,
    total: (r.total != null) ? r.total : "?",
    badge: r.badge || null,
    linhas: Array.isArray(r.linhas) ? r.linhas : null
  };
}

async function carregarFeed(){
  nomesCache[meuId] = meuNome;

  const [{ data: rolagens }, { data: mensagens }] = await Promise.all([
    sb.from("rolagens").select("*").eq("sala_id", salaId).order("criado_em", { ascending:false }).limit(30),
    sb.from("mensagens").select("*").eq("sala_id", salaId).order("criado_em", { ascending:false }).limit(30)
  ]);

  const porGrupo = {};
  const rolagensEventos = [];
  (rolagens || []).slice().reverse().forEach(row => {
    const grupo = (row.resultado || {}).grupo || null;
    if(grupo && porGrupo[grupo]){
      porGrupo[grupo].partes.push(parteDeLinha(row));
      return;
    }
    const entrada = {
      tipo: "rolagem", user_id: row.user_id, criado_em: row.criado_em,
      grupo: grupo, arma: (row.resultado || {}).arma || null,
      partes: [parteDeLinha(row)]
    };
    if(grupo) porGrupo[grupo] = entrada;
    rolagensEventos.push(entrada);
  });

  const eventos = [
    ...rolagensEventos,
    ...((mensagens || []).slice().reverse().map(m => ({ tipo:"mensagem", ...m })))
  ];
  eventos.sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
  feedEventos = eventos.slice(-40);

  for(const ev of feedEventos){ await nomeDoUsuario(ev.user_id); }
  renderizarFeed();
}

function empilharEvento(ev){
  feedEventos.push(ev);
  if(feedEventos.length > 40) feedEventos.shift();
  renderizarFeed();
}

function empilharRolagem(row){
  const grupo = (row.resultado || {}).grupo || null;
  const parte = parteDeLinha(row);
  if(grupo){
    const existente = feedEventos.find(ev => ev.tipo === "rolagem" && ev.grupo === grupo);
    if(existente){
      existente.partes.push(parte);
      renderizarFeed();
      return;
    }
  }
  empilharEvento({
    tipo: "rolagem", user_id: row.user_id, criado_em: row.criado_em,
    grupo: grupo, arma: (row.resultado || {}).arma || null,
    partes: [parte]
  });
}

function cartaRolagemHtml(ev, nome){
  const titulo = ev.arma || (ev.partes[0] && ev.partes[0].formula) || "Rolagem";
  const linhasHtml = ev.partes.map(p => {
    const rotulo = p.etapa ? (ROTULO_ETAPA[p.etapa] || p.etapa) : p.formula;
    const dadosHtml = p.dados.map(d => '<span class="dado-cubo">' + d + '</span>').join("");
    const modHtml = p.modificador ? '<span class="modificador">' + (p.modificador > 0 ? "+" : "") + p.modificador + '</span>' : "";
    const badgeHtml = (p.badge && p.badge.texto)
      ? '<span class="cr-badge cr-' + (p.badge.classe || "default") + '">' + escapeHtml(p.badge.texto) + '</span>' : "";
    const descHtml = p.linhas ? p.linhas.map(l => '<div class="cr-desc">' + l + '</div>').join("") : "";
    return '<div class="cr-linha">' +
      '<span class="cr-etapa">' + escapeHtml(rotulo) + '</span>' +
      '<span class="dados-visual">' + dadosHtml + modHtml + '</span>' +
      '<span class="total">' + p.total + '</span>' +
      badgeHtml +
    '</div>' + descHtml;
  }).join("");

  return '<div class="carta-rolagem">' +
    '<div class="cr-cab"><span class="cr-titulo">' + escapeHtml(titulo) + '</span><span class="cr-quem">' + escapeHtml(nome) + '</span></div>' +
    linhasHtml +
  '</div>';
}

function renderizarFeed(){
  const area = document.getElementById("log_rolagens");
  if(!feedEventos.length){ area.innerHTML = '<div class="log-vazio">Nenhuma atividade ainda.</div>'; return; }
  area.innerHTML = feedEventos.map(ev => {
    const nome = nomesCache[ev.user_id] || "Jogador";
    if(ev.tipo === "rolagem") return cartaRolagemHtml(ev, nome);
    return '<div class="log-item mensagem"><span class="quem">' + escapeHtml(nome) + ':</span> ' +
      '<span class="texto">' + escapeHtml(ev.texto) + '</span></div>';
  }).join("");
  area.scrollTop = area.scrollHeight;
}

/* ===== Presença (Supabase Realtime) ===== */

function conectarPresenca(){
  canal = sb.channel("sala:" + salaId, {
    config: { presence: { key: meuId } }
  });

  canal.on("presence", { event: "sync" }, () => {
    const estado = canal.presenceState();
    renderizarPresenca(estado);
  });

  /* troca de cena ativa na sala (ex.: mestre trocou de mapa/cena, ou apagou a cena ativa) */
  canal.on("postgres_changes",
    { event: "UPDATE", schema: "public", table: "salas", filter: "id=eq." + salaId },
    async (payload) => {
      salaAtual = payload.new;
      if(salaAtual.cena_ativa){
        if(salaAtual.cena_ativa !== (cenaAtual && cenaAtual.id)){
          const { data: cena } = await sb.from("cenas").select("*").eq("id", salaAtual.cena_ativa).single();
          cenaAtual = cena || null;
          await carregarTokens();
          await carregarFog();
          atualizarSub();
          carregarMapa();
        }
      } else if(cenaAtual){
        cenaAtual = null;
        tokensAtuais = [];
        fogRevelado = new Set();
        atualizarSub();
        carregarMapa();
      }
      if(document.getElementById("painel_mapas").classList.contains("aberto")) carregarListaMapas();
    }
  );

  /* a própria cena ativa foi atualizada (ex.: trocou a imagem, ou só o grid mudou) */
  canal.on("postgres_changes",
    { event: "UPDATE", schema: "public", table: "cenas", filter: "sala_id=eq." + salaId },
    (payload) => {
      if(cenaAtual && payload.new.id === cenaAtual.id){
        const mapaMudou = payload.new.mapa_url !== cenaAtual.mapa_url;
        cenaAtual = payload.new;
        atualizarSub();
        if(mapaMudou) carregarMapa(); else desenhar();
      }
      if(document.getElementById("painel_mapas").classList.contains("aberto")) carregarListaMapas();
    }
  );

  /* lista de mapas: novo mapa criado ou apagado por outra aba/pessoa */
  canal.on("postgres_changes",
    { event: "INSERT", schema: "public", table: "cenas", filter: "sala_id=eq." + salaId },
    () => { if(document.getElementById("painel_mapas").classList.contains("aberto")) carregarListaMapas(); }
  );
  canal.on("postgres_changes",
    { event: "DELETE", schema: "public", table: "cenas", filter: "sala_id=eq." + salaId },
    () => { if(document.getElementById("painel_mapas").classList.contains("aberto")) carregarListaMapas(); }
  );

  /* iniciativa da sala */
  canal.on("postgres_changes",
    { event: "*", schema: "public", table: "iniciativa", filter: "sala_id=eq." + salaId },
    (payload) => {
      if(payload.new){
        iniciativaOrdem = Array.isArray(payload.new.ordem) ? payload.new.ordem : [];
        iniciativaAtual = typeof payload.new.atual === "number" ? payload.new.atual : 0;
      } else {
        iniciativaOrdem = [];
        iniciativaAtual = 0;
      }
      renderizarIniciativa();
    }
  );

  /* novas rolagens da sala */
  canal.on("postgres_changes",
    { event: "INSERT", schema: "public", table: "rolagens", filter: "sala_id=eq." + salaId },
    async (payload) => {
      await nomeDoUsuario(payload.new.user_id);
      empilharRolagem(payload.new);
    }
  );

  /* novas mensagens de chat da sala */
  canal.on("postgres_changes",
    { event: "INSERT", schema: "public", table: "mensagens", filter: "sala_id=eq." + salaId },
    async (payload) => {
      await nomeDoUsuario(payload.new.user_id);
      empilharEvento({ tipo: "mensagem", ...payload.new });
    }
  );

  /* ping no mapa (efêmero, não grava no banco) */
  canal.on("broadcast", { event: "ping" }, (msg) => {
    adicionarPing(msg.payload.x, msg.payload.y, msg.payload.cor);
  });

  /* cursor do mestre, só pros jogadores (efêmero) */
  canal.on("broadcast", { event: "cursor_mestre" }, (msg) => {
    cursorMestre = { x: msg.payload.x, y: msg.payload.y };
    desenhar();
  });
  canal.on("broadcast", { event: "cursor_mestre_limpar" }, () => {
    cursorMestre = null;
    desenhar();
  });

  /* movimento ao vivo (efêmero, não grava no banco) */
  canal.on("broadcast", { event: "mover_token" }, (msg) => {
    const t = tokensAtuais.find(tk => tk.id === msg.payload.id);
    if(t){
      t.x = msg.payload.x;
      t.y = msg.payload.y;
      desenhar();
    }
  });

  /* novos tokens criados na cena atual */
  if(cenaAtual){
    canal.on("postgres_changes",
      { event: "INSERT", schema: "public", table: "tokens", filter: "cena_id=eq." + cenaAtual.id },
      (payload) => {
        tokensAtuais.push(payload.new);
        desenhar();
      }
    );

    /* posição final gravada (snap ao grid), sincroniza pra quem entrou depois */
    canal.on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "tokens", filter: "cena_id=eq." + cenaAtual.id },
      (payload) => {
        const t = tokensAtuais.find(tk => tk.id === payload.new.id);
        if(t) Object.assign(t, payload.new);
        else tokensAtuais.push(payload.new);
        desenhar();
      }
    );

    /* névoa revelada/escondida pelo mestre */
    canal.on("postgres_changes",
      { event: "*", schema: "public", table: "fog", filter: "cena_id=eq." + cenaAtual.id },
      (payload) => {
        if(payload.new && Array.isArray(payload.new.revelado)){
          fogRevelado = new Set(payload.new.revelado.map(par => par[0] + "," + par[1]));
          desenhar();
        }
      }
    );
  }

  canal.subscribe(async (status) => {
    if(status === "SUBSCRIBED"){
      await canal.track({ nome: meuNome, entrou_em: new Date().toISOString() });
    }
  });
}

function renderizarPresenca(estado){
  const area = document.getElementById("area_presenca");
  const chaves = Object.keys(estado);
  const vistos = new Set();
  let html = "";
  chaves.forEach(k => {
    if(vistos.has(k)) return;
    vistos.add(k);
    const info = estado[k][0] || {};
    const nome = info.nome || "Jogador";
    html += '<div class="avatar">' + escapeHtml(iniciais(nome)) +
      '<span class="tooltip">' + escapeHtml(nome) + '</span></div>';
  });
  html += '<span class="contador-online">' + chaves.length + ' online</span>';
  area.innerHTML = html;
}

document.getElementById("btn_sair").addEventListener("click", async () => {
  if(canal) await sb.removeChannel(canal);
  location.href = "home.html";
});

iniciar();
</script>
