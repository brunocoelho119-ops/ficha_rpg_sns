<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Fichas — Shinobi no Sho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tinta e papel: a mesma identidade da mesa e da ficha */
  :root{
    --aizome:#1d2738; --aizome-2:#2a3850; --aizome-3:#3a4a66; --fundo:#141b27; --vidro:rgba(29,39,56,0.92);
    --washi:#f3ecdc; --washi-2:#e8dfca; --washi-borda:#d9ccb0;
    --sumi:#24201c; --sumi-2:#5e554b; --shu:#b3372b; --kinari:#d9b872; --nezumi:#9aa6b8; --claro:#eef1f6;
    --erro:#a83226; --raio:16px; --raio-p:9px;
    --sombra:0 12px 32px rgba(4,8,16,0.4), 0 2px 6px rgba(4,8,16,0.25);
    --font-display:'Shippori Mincho B1', Georgia, serif; --font-body:'Inter', Arial, sans-serif;
    /* compatibilidade */
    --ink:var(--sumi); --bg:var(--washi); --gray-light:var(--washi-2); --gray-text:var(--sumi-2);
    --border:var(--washi-borda); --border-strong:#c9b995; --bar-bg:var(--aizome); --shadow:var(--sombra); --radius:var(--raio);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:var(--font-body); background:var(--fundo); color:var(--claro); -webkit-font-smoothing:antialiased; }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:url('konoha-bg.jpg') center center / cover no-repeat; opacity:0.08;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(1100px 520px at 50% -8%, rgba(58,74,102,0.6), transparent 70%);
  }
  :focus-visible{ outline:2px solid var(--kinari); outline-offset:2px; }

  /* topo */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--vidro); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08); padding:12px 22px; display:flex; align-items:center;
    justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .topbar .marca{ display:flex; align-items:center; gap:12px; }
  .topbar .selo{
    width:38px; height:38px; border-radius:50%; background:var(--shu); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:17px; flex-shrink:0;
  }
  .topbar .tt{ font-family:var(--font-display); font-size:19px; font-weight:800; color:var(--claro); line-height:1.1; }
  .topbar .sub{ font-size:12.5px; color:var(--nezumi); font-weight:500; }
  .topbar .dir{ display:flex; align-items:center; gap:10px; }
  .sair{
    background:transparent; border:1px solid rgba(255,255,255,0.18); color:var(--claro); border-radius:999px;
    padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);
  }
  .sair:hover{ background:rgba(255,255,255,0.08); }
  .badge-role{
    display:inline-block; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px;
    background:rgba(255,255,255,0.08); color:var(--claro); border:1px solid rgba(255,255,255,0.14);
  }
  .badge-role.mestre{ background:var(--kinari); color:var(--sumi); border-color:var(--kinari); }

  /* conteúdo */
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 70px; }
  .barra-acoes{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:34px 0 14px; flex-wrap:wrap; }
  .secao-titulo{
    font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--claro); margin:0 0 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .barra-acoes .secao-titulo{ margin:0; }
  .btn-nova{
    border:none; border-radius:10px; background:var(--washi); color:var(--sumi); font-weight:600; font-size:13.5px;
    padding:10px 16px; cursor:pointer; font-family:var(--font-body); box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .btn-nova:hover{ background:#fff; }
  .grupo-titulo{ font-size:13px; color:var(--nezumi); font-weight:600; margin:22px 0 10px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .card{
    background:var(--washi); color:var(--sumi); border:1px solid var(--washi-borda); border-radius:var(--raio); padding:16px 16px 14px;
    box-shadow:var(--sombra); display:flex; flex-direction:column; gap:8px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 18px 40px rgba(4,8,16,0.5); }
  .card .nome{ font-family:var(--font-display); font-size:19px; font-weight:800; color:var(--sumi); line-height:1.2; }
  .card .meta{ font-size:12px; color:var(--sumi-2); font-weight:500; line-height:1.5; }
  .card .acoes{ display:flex; gap:6px; margin-top:auto; padding-top:6px; flex-wrap:wrap; }
  .card .acoes button{
    font-size:12px; font-weight:600; border-radius:var(--raio-p); padding:7px 12px; cursor:pointer;
    border:1px solid var(--washi-borda); background:#fff; color:var(--sumi); font-family:var(--font-body);
  }
  .card .acoes button:hover{ border-color:var(--sumi-2); }
  .card .acoes button.primaria, .card .acoes button.abrir{ background:var(--aizome); color:#fff; border-color:var(--aizome); }
  .card .acoes button.primaria:hover, .card .acoes button.abrir:hover{ background:var(--aizome-2); }
  .card .acoes button.apagar{ color:var(--erro); margin-left:auto; }
  .card .acoes button.apagar-sala{ margin-left:0; }
  .card .tipo-tag{ align-self:flex-start; font-size:10.5px; font-weight:700; color:#fff; border-radius:999px; padding:2px 9px; }
  .tipo-opcoes{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tipo-opcao{ text-align:left; border:1.5px solid var(--washi-borda); background:#fff; border-radius:12px; padding:12px; cursor:pointer; font-family:var(--font-body); color:var(--sumi); display:flex; flex-direction:column; gap:4px; }
  .tipo-opcao:hover{ border-color:var(--aizome); }
  .tipo-opcao b{ font-family:var(--font-display); font-size:16px; }
  .tipo-opcao span{ font-size:12px; color:var(--sumi-2); line-height:1.4; }
  .card .meta .sala-tag{ display:inline-block; margin-top:4px; padding:2px 9px; border-radius:999px; background:#e1e7f1; color:var(--aizome); font-weight:600; }
  .card .meta .sala-tag.sem{ background:var(--washi-2); color:var(--sumi-2); }
  .vazio, .carregando{
    padding:34px 22px; text-align:center; color:var(--nezumi); font-size:13.5px; line-height:1.55;
    border:1.5px dashed rgba(255,255,255,0.14); border-radius:var(--raio);
  }
  .bloco-salas{ margin-bottom:10px; }

  /* janela de jogadores */
  .overlay{
    position:fixed; inset:0; background:rgba(8,12,20,0.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal{
    background:var(--washi); color:var(--sumi); border-radius:var(--raio); max-width:440px; width:100%; max-height:82vh;
    overflow:hidden; box-shadow:var(--sombra); display:flex; flex-direction:column;
  }
  .modal .cab{
    padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--washi-borda);
    font-family:var(--font-display); font-weight:800; font-size:19px; flex-shrink:0; color:var(--sumi);
  }
  .modal .cab button{ background:transparent; border:none; color:var(--sumi-2); font-size:15px; cursor:pointer; width:30px; height:30px; border-radius:50%; }
  .modal .cab button:hover{ background:var(--washi-2); }
  .modal .corpo{ padding:8px 18px; overflow-y:auto; }
  .linha-membro{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--washi-borda); font-size:13.5px; }
  .linha-membro:last-child{ border-bottom:none; }
  .linha-membro input{ width:16px; height:16px; accent-color:var(--aizome); }
  .linha-membro .papel{ margin-left:auto; font-size:11.5px; color:var(--sumi-2); font-weight:600; }
  .modal .rodape{ padding:12px 18px; border-top:1px solid var(--washi-borda); display:flex; justify-content:flex-end; gap:8px; flex-shrink:0; }
  .modal .rodape button{ border:none; border-radius:var(--raio-p); padding:9px 16px; font-weight:600; font-size:13px; cursor:pointer; font-family:var(--font-body); }
  .modal .rodape .salvar{ background:var(--aizome); color:#fff; }
  .modal .rodape .cancelar{ background:#fff; color:var(--sumi); border:1px solid var(--washi-borda); }
  @media (max-width: 600px){ .topbar .sub{ display:none; } .secao-titulo{ font-size:21px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<div class="topbar">
  <div class="marca">
    <div class="selo">忍</div>
    <div>
      <div class="tt">Shinobi no Sho</div>
      <div class="sub" id="saudacao">Carregando…</div>
    </div>
  </div>
  <div class="dir">
    <span class="badge-role" id="badge_role">—</span>
    <button class="sair" id="btn_sair">Sair</button>
  </div>
</div>

<div class="wrap">
  <div class="bloco-salas">
    <div class="secao-titulo">
      <span>Salas</span>
      <button class="btn-nova" id="btn_nova_sala" style="display:none;">+ Nova sala</button>
    </div>
    <div id="area_salas"><div class="carregando">Carregando salas…</div></div>
  </div>

  <div class="barra-acoes">
    <div class="secao-titulo" id="titulo_fichas">Fichas</div>
    <button class="btn-nova" id="btn_nova">+ Nova ficha</button>
  </div>
  <div id="area_listas"><div class="carregando">Carregando suas fichas…</div></div>
</div>

<div class="overlay" id="overlay_membros" style="display:none;"></div>

<script>
let meuId = null, meuRole = "player";
let nomesSalas = {};   // id da sala -> nome (para mostrar em qual sala cada ficha está)

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatarData(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

async function iniciar(){
  const { data: sess } = await sb.auth.getSession();
  if(!sess.session){ location.href = "index.html"; return; }
  meuId = sess.session.user.id;

  const { data: perfil, error: errPerfil } = await sb.from("perfis").select("nome, role").eq("id", meuId).single();
  if(errPerfil){ console.error(errPerfil); }
  meuRole = (perfil && perfil.role) || "player";

  document.getElementById("saudacao").textContent = "Olá, " + ((perfil && perfil.nome) || sess.session.user.email);
  const badge = document.getElementById("badge_role");
  badge.textContent = (meuRole === "mestre") ? "Mestre" : "Player";
  badge.classList.toggle("mestre", meuRole === "mestre");

  if(meuRole === "mestre"){
    document.getElementById("btn_nova_sala").style.display = "inline-block";
  }

  await carregarSalas();
  await carregarFichas();
}

/* ===== Salas ===== */

async function carregarSalas(){
  const area = document.getElementById("area_salas");
  area.innerHTML = '<div class="carregando">Carregando salas…</div>';

  const { data: todasSalas, error } = await sb.from("salas").select("*").order("criado_em", { ascending:false });
  nomesSalas = {}; (todasSalas || []).forEach(s => { nomesSalas[s.id] = s.nome; });
  if(error){ area.innerHTML = '<div class="vazio">Erro ao carregar salas: ' + escapeHtml(error.message) + '</div>'; return; }

  const { data: minhasMembresias } = await sb.from("sala_membros").select("sala_id").eq("user_id", meuId);
  const idsSouMembro = new Set((minhasMembresias || []).map(m => m.sala_id));

  const minhasSalas = (todasSalas || []).filter(s => s.mestre_id === meuId);
  const salasQueParticipo = (todasSalas || []).filter(s => s.mestre_id !== meuId && idsSouMembro.has(s.id));

  let html = "";

  if(meuRole === "mestre"){
    html += '<div class="grupo-titulo">Minhas salas (como mestre)</div>';
    if(minhasSalas.length === 0){
      html += '<div class="vazio">Você ainda não criou nenhuma sala. Use \"+ Nova sala\" para abrir a primeira mesa da campanha.</div>';
    } else {
      html += '<div class="grid">' + minhasSalas.map(s => cardSalaHtml(s, true)).join("") + '</div>';
    }
  }

  if(salasQueParticipo.length > 0){
    html += '<div class="grupo-titulo">Salas que participo</div>';
    html += '<div class="grid">' + salasQueParticipo.map(s => cardSalaHtml(s, false)).join("") + '</div>';
  }

  if(html === ""){
    html = '<div class="vazio">Você ainda não está em nenhuma sala. Peça ao mestre para te adicionar como jogador.</div>';
  }

  area.innerHTML = html;
  ligarCliquesSalas();
}

function cardSalaHtml(s, souDono){
  return '<div class="card" data-sala-id="' + s.id + '" data-sala-nome="' + escapeHtml(s.nome) + '">' +
    '<div class="nome">' + escapeHtml(s.nome) + '</div>' +
    '<div class="meta">Criada em ' + formatarData(s.criado_em) + '</div>' +
    '<div class="acoes">' +
      '<button type="button" class="primaria entrar">Entrar</button>' +
      (souDono ? '<button type="button" class="jogadores">Jogadores</button>' +
                 '<button type="button" class="renomear">Renomear</button>' +
                 '<button type="button" class="apagar apagar-sala">Apagar</button>' : '') +
    '</div>' +
  '</div>';
}

function ligarCliquesSalas(){
  document.querySelectorAll("#area_salas .card").forEach(card => {
    const id = card.dataset.salaId;
    const nome = card.dataset.salaNome;
    card.querySelector(".entrar").addEventListener("click", (e) => {
      e.stopPropagation();
      location.href = "mesa.html?sala=" + id;
    });
    const btnRen = card.querySelector(".renomear");
    if(btnRen) btnRen.addEventListener("click", async (e) => {
      e.stopPropagation();
      const novo = prompt("Novo nome da sala:", nome);
      if(novo == null || !novo.trim() || novo.trim() === nome) return;
      const { error } = await sb.from("salas").update({ nome: novo.trim() }).eq("id", id);
      if(error){ alert("Não foi possível renomear a sala: " + error.message); return; }
      carregarSalas(); carregarFichas();
    });
    const btnApagarSala = card.querySelector(".apagar-sala");
    if(btnApagarSala) btnApagarSala.addEventListener("click", async (e) => {
      e.stopPropagation();
      const conf = prompt('Apagar a sala "' + nome + '" apaga também os mapas, tokens, névoa, iniciativa, rolagens e o chat dela. As fichas continuam existindo.\n\nPara confirmar, digite o nome da sala:');
      if(conf == null) return;
      if(conf.trim() !== nome.trim()){ alert("O nome digitado não confere. Nada foi apagado."); return; }
      /* imagens dos mapas ficam no armazenamento: apaga a pasta da sala antes */
      try{
        const { data: arqs } = await sb.storage.from("mapas").list(id, { limit: 1000 });
        if(arqs && arqs.length) await sb.storage.from("mapas").remove(arqs.map(a => id + "/" + a.name));
      }catch(err){ console.warn(err); }
      const { error } = await sb.from("salas").delete().eq("id", id);
      if(error){ alert("Não foi possível apagar a sala: " + error.message); return; }
      carregarSalas(); carregarFichas();
    });
    const btnJogadores = card.querySelector(".jogadores");
    if(btnJogadores){
      btnJogadores.addEventListener("click", (e) => {
        e.stopPropagation();
        abrirModalMembros(id, nome);
      });
    }
  });
}

document.getElementById("btn_nova_sala").addEventListener("click", async () => {
  const nome = prompt("Nome da nova sala:", "Nova Sala");
  if(nome == null) return;
  const { error } = await sb.from("salas").insert({ mestre_id: meuId, nome: nome.trim() || "Sala sem nome" });
  if(error){ alert("Não foi possível criar a sala: " + error.message); return; }
  carregarSalas();
});

/* ===== Gerenciar jogadores da sala ===== */

async function abrirModalMembros(salaId, salaNome){
  const overlay = document.getElementById("overlay_membros");
  overlay.innerHTML = '<div class="modal"><div class="cab"><span>Carregando…</span></div></div>';
  overlay.style.display = "flex";

  const { data: perfis } = await sb.from("perfis").select("id, nome, role").order("nome");
  const { data: atuais } = await sb.from("sala_membros").select("user_id").eq("sala_id", salaId);
  const idsAtuais = new Set((atuais || []).map(m => m.user_id));

  const lista = (perfis || []).filter(p => p.id !== meuId);

  const linhasHtml = lista.map(p =>
    '<label class="linha-membro">' +
      '<input type="checkbox" value="' + p.id + '"' + (idsAtuais.has(p.id) ? ' checked' : '') + '>' +
      '<span>' + escapeHtml(p.nome) + '</span>' +
      '<span class="papel">' + (p.role === "mestre" ? "Mestre" : "Player") + '</span>' +
    '</label>'
  ).join("") || '<div class="vazio">Nenhum outro perfil cadastrado ainda.</div>';

  overlay.innerHTML =
    '<div class="modal">' +
      '<div class="cab"><span>Jogadores — ' + escapeHtml(salaNome) + '</span><button type="button" id="btn_fechar_membros">✕</button></div>' +
      '<div class="corpo">' + linhasHtml + '</div>' +
      '<div class="rodape">' +
        '<button type="button" class="cancelar" id="btn_cancelar_membros">Cancelar</button>' +
        '<button type="button" class="salvar" id="btn_salvar_membros">Salvar</button>' +
      '</div>' +
    '</div>';

  const fechar = () => { overlay.style.display = "none"; overlay.innerHTML = ""; };
  overlay.addEventListener("click", (e) => { if(e.target === overlay) fechar(); }, { once:true });
  document.getElementById("btn_fechar_membros").addEventListener("click", fechar);
  document.getElementById("btn_cancelar_membros").addEventListener("click", fechar);

  document.getElementById("btn_salvar_membros").addEventListener("click", async () => {
    const marcados = new Set(
      Array.from(overlay.querySelectorAll('input[type="checkbox"]:checked')).map(el => el.value)
    );

    const adicionar = [...marcados].filter(id => !idsAtuais.has(id));
    const remover = [...idsAtuais].filter(id => !marcados.has(id));

    if(adicionar.length){
      const { error } = await sb.from("sala_membros").insert(adicionar.map(uid => ({ sala_id: salaId, user_id: uid })));
      if(error){ alert("Não foi possível adicionar alguém: " + error.message); return; }
    }
    if(remover.length){
      const { error } = await sb.from("sala_membros").delete().eq("sala_id", salaId).in("user_id", remover);
      if(error){ alert("Não foi possível remover alguém: " + error.message); return; }
    }
    fechar();
  });
}

/* ===== Fichas ===== */

async function carregarFichas(){
  const area = document.getElementById("area_listas");
  area.innerHTML = '<div class="carregando">Carregando suas fichas…</div>';

  /* RLS já garante: Player só recebe as próprias; Mestre recebe todas */
  let { data: fichas, error } = await sb.from("fichas").select("id, user_id, nome, atualizado_em, sala_id, tipo").order("atualizado_em", { ascending:false });
  if(error && /tipo/.test(error.message || "")) ({ data: fichas, error } = await sb.from("fichas").select("id, user_id, nome, atualizado_em, sala_id").order("atualizado_em", { ascending:false }));
  if(error){ area.innerHTML = '<div class="vazio">Erro ao carregar: ' + escapeHtml(error.message) + '</div>'; return; }

  if(!fichas || fichas.length === 0){
    area.innerHTML = '<div class="vazio">Você ainda não tem nenhuma ficha. Clique em "+ Nova Ficha" para começar.</div>';
    return;
  }

  const tipoDe = f => f.tipo || "pj";
  const secao = (titulo, lista) => lista.length ? '<div class="grupo-titulo">' + escapeHtml(titulo) + '</div><div class="grid">' + lista.map(f => cardHtml(f)).join("") + '</div>' : "";
  if(meuRole !== "mestre"){
    area.innerHTML = secao("Personagens", fichas.filter(f => tipoDe(f) === "pj")) + secao("Invocações", fichas.filter(f => tipoDe(f) === "invocacao"));
    ligarCliques();
    return;
  }

  /* Mestre: agrupa por dono, buscando nome de cada um em perfis (RLS libera pra mestre) */
  const ids = [...new Set(fichas.map(f => f.user_id))];
  const { data: perfisDonos } = await sb.from("perfis").select("id, nome").in("id", ids);
  const nomePor = {};
  (perfisDonos || []).forEach(p => { nomePor[p.id] = p.nome; });

  const porDono = {};
  fichas.filter(f => tipoDe(f) === "pj").forEach(f => {
    const key = f.user_id;
    if(!porDono[key]) porDono[key] = [];
    porDono[key].push(f);
  });

  let html = "";
  Object.keys(porDono).forEach(uid => {
    const rotulo = (uid === meuId) ? "Suas fichas" : (nomePor[uid] || "Jogador");
    html += '<div class="grupo-titulo">' + escapeHtml(rotulo) + '</div>';
    html += '<div class="grid">' + porDono[uid].map(f => cardHtml(f)).join("") + '</div>';
  });
  html += secao("PdMs e capangas", fichas.filter(f => tipoDe(f) === "pdm" || tipoDe(f) === "capanga"));
  html += secao("Invocações", fichas.filter(f => tipoDe(f) === "invocacao"));
  area.innerHTML = html;
  ligarCliques();
}

function cardHtml(f){
  const minha = f.user_id === meuId;
  const sala = f.sala_id ? (nomesSalas[f.sala_id] || "Sala sem acesso") : null;
  return '<div class="card" data-id="' + f.id + '" data-nome="' + escapeHtml(f.nome || "Ficha sem nome") + '">' +
    (TIPOS_FICHA[f.tipo] && f.tipo !== "pj" ? '<span class="tipo-tag" style="background:' + TIPOS_FICHA[f.tipo].cor + '">' + TIPOS_FICHA[f.tipo].rotulo + '</span>' : '') +
    '<div class="nome">' + escapeHtml(f.nome || "Ficha sem nome") + '</div>' +
    '<div class="meta">Atualizada em ' + formatarData(f.atualizado_em) + '<br>' +
      (sala ? '<span class="sala-tag">Sala: ' + escapeHtml(sala) + '</span>' : '<span class="sala-tag sem">Sem sala vinculada</span>') + '</div>' +
    '<div class="acoes">' +
      '<button type="button" class="abrir">Abrir</button>' +
      (minha ? '<button type="button" class="apagar">Apagar</button>' : '') +   /* o mestre não apaga fichas dos jogadores */
    '</div>' +
  '</div>';
}

function ligarCliques(){
  document.querySelectorAll("#area_listas .card").forEach(card => {
    const id = card.dataset.id;
    card.querySelector(".abrir").addEventListener("click", (e) => { e.stopPropagation(); abrirFicha(id); });
    card.addEventListener("click", () => abrirFicha(id));
    const btnApagar = card.querySelector(".apagar");
    if(btnApagar) btnApagar.addEventListener("click", async (e) => {
      e.stopPropagation();
      if(!confirm('Apagar a ficha "' + (card.dataset.nome || "") + '"? Essa ação não pode ser desfeita.')) return;
      const { error } = await sb.from("fichas").delete().eq("id", id);
      if(error){ alert("Não foi possível apagar: " + error.message); return; }
      carregarFichas();
    });
  });
}

function abrirFicha(id){ location.href = "ficha.html?id=" + id; }

const TIPOS_FICHA = {
  pj:        { rotulo:"Personagem", cor:"#1d2738", desc:"Ficha completa de jogador.", nome:"Novo Shinobi" },
  pdm:       { rotulo:"PdM", cor:"#b3372b", desc:"Personagem do mestre: ficha simplificada, perícias pelo atributo.", nome:"Novo PdM", mestre:true },
  capanga:   { rotulo:"Capanga", cor:"#5e554b", desc:"Um cartão só: precisões, dano e 1 de Vitalidade.", nome:"Novo capanga", mestre:true },
  invocacao: { rotulo:"Invocação", cor:"#1f4a35", desc:"Criatura do Kuchiyose, vinculada a quem invoca.", nome:"Nova invocação" }
};
function escolherTipoFicha(){
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "overlay";
    const tipos = Object.keys(TIPOS_FICHA).filter(k => meuRole === "mestre" || !TIPOS_FICHA[k].mestre);
    ov.innerHTML = '<div class="modal" role="dialog" aria-label="Tipo de ficha"><div class="cab"><span>Nova ficha</span><button type="button" aria-label="Fechar">✕</button></div>' +
      '<div class="corpo" style="padding:14px 18px;"><div class="tipo-opcoes">' +
      tipos.map(k => '<button type="button" class="tipo-opcao" data-tipo="' + k + '"><b>' + TIPOS_FICHA[k].rotulo + '</b><span>' + TIPOS_FICHA[k].desc + '</span></button>').join("") +
      '</div></div></div>';
    const fechar = v => { ov.remove(); resolve(v); };
    ov.addEventListener("click", e => { const b = e.target.closest(".tipo-opcao"); if(b) return fechar(b.dataset.tipo); if(e.target === ov || e.target.closest(".cab button")) fechar(null); });
    document.body.appendChild(ov);
  });
}
document.getElementById("btn_nova").addEventListener("click", async () => {
  const tipo = await escolherTipoFicha();
  if(!tipo) return;
  const nome = prompt("Nome da nova ficha:", TIPOS_FICHA[tipo].nome);
  if(nome == null) return;
  const linha = { user_id: meuId, nome: nome.trim() || "Ficha sem nome", dados:{} };
  if(tipo !== "pj") linha.tipo = tipo;
  const { data, error } = await sb.from("fichas").insert(linha).select("id").single();
  if(error){ alert("Não foi possível criar a ficha: " + error.message + (/tipo/.test(error.message) ? " (rode o fichas_npc.sql)" : "")); return; }
  location.href = "ficha.html?id=" + data.id;
});

document.getElementById("btn_sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.href = "index.html";
});

iniciar();
</script>
