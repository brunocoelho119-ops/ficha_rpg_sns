<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Shinobi no Sho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tinta e papel: a mesma identidade da mesa e da ficha */
  :root{
    --aizome:#1d2738; --aizome-2:#2a3850; --fundo:#141b27;
    --washi:#f3ecdc; --washi-2:#e8dfca; --washi-borda:#d9ccb0;
    --sumi:#24201c; --sumi-2:#5e554b; --shu:#b3372b; --kinari:#d9b872; --nezumi:#9aa6b8; --claro:#eef1f6;
    --ok:#2f7a4a; --erro:#a83226;
    --raio:16px; --sombra:0 18px 50px rgba(4,8,16,0.5), 0 2px 8px rgba(4,8,16,0.35);
    --font-display:'Shippori Mincho B1', Georgia, serif; --font-body:'Inter', Arial, sans-serif;
    /* compatibilidade */
    --ink:var(--sumi); --gray-text:var(--sumi-2); --bar-bg:var(--aizome);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--font-body); background:var(--fundo); color:var(--sumi); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:url('konoha-bg.jpg') center center / cover no-repeat; opacity:0.1;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(900px 500px at 50% 0%, rgba(58,74,102,0.6), transparent 70%);
  }
  :focus-visible{ outline:2px solid var(--kinari); outline-offset:2px; }
  .marca{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; color:var(--claro); text-align:center; }
  .marca .selo{
    width:62px; height:62px; border-radius:50%; background:var(--shu); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:28px; box-shadow:0 0 0 3px var(--fundo), 0 0 0 5px var(--shu);
  }
  .marca .nome{ font-family:var(--font-display); font-weight:800; font-size:28px; letter-spacing:0.2px; }
  .marca .lema{ font-size:13px; color:var(--nezumi); }
  .card{
    width:100%; max-width:400px; background:var(--washi); border-radius:var(--raio); box-shadow:var(--sombra);
    overflow:hidden; border:1px solid rgba(255,255,255,0.06);
  }
  .head{ padding:20px 24px 4px; }
  .head .t1{ display:none; }
  .head .t2{ font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--sumi); }
  .body{ padding:14px 24px 24px; }
  .tabs{ display:flex; gap:4px; margin-bottom:18px; background:var(--washi-2); border-radius:12px; padding:4px; }
  .tab{
    flex:1; padding:9px 10px; text-align:center; border:none; border-radius:9px; background:transparent;
    font-weight:600; font-size:13px; cursor:pointer; font-family:var(--font-body); color:var(--sumi-2);
  }
  .tab.active{ background:#fff; color:var(--sumi); box-shadow:0 1px 3px rgba(36,32,28,0.12); }
  label{ display:block; font-size:12px; font-weight:600; color:var(--sumi-2); margin:14px 0 6px; }
  #lbl_nome + input + label{ margin-top:14px !important; }
  .campo-senha{ position:relative; }
  input[type=text], input[type=email], input[type=password]{
    width:100%; padding:11px 12px; font-size:14px; font-family:var(--font-body);
    background:#fff; border:1px solid var(--washi-borda); border-radius:10px; color:var(--sumi);
  }
  .campo-senha input{ padding-right:74px; }
  input:focus{ outline:2px solid var(--aizome); outline-offset:-1px; border-color:transparent; }
  .ver-senha{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:transparent;
    font-size:12px; font-weight:600; color:var(--sumi-2); cursor:pointer; padding:6px 8px; border-radius:7px; font-family:var(--font-body);
  }
  .ver-senha:hover{ background:var(--washi-2); color:var(--sumi); }
  .btn{
    width:100%; margin-top:20px; padding:12px; border:none; border-radius:10px;
    background:var(--aizome); color:#fff; font-weight:600; font-size:14px; cursor:pointer; font-family:var(--font-body);
  }
  .btn:disabled{ opacity:0.55; cursor:progress; }
  .btn:hover:not(:disabled){ background:var(--aizome-2); }
  .link-esqueci{ display:block; margin:12px auto 0; background:none; border:none; padding:4px; font-size:12.5px; color:var(--sumi-2); cursor:pointer; text-decoration:underline; font-family:var(--font-body); }
  .link-esqueci:hover{ color:var(--sumi); }
  .msg{ margin-top:14px; font-size:12.5px; line-height:1.5; padding:10px 12px; border-radius:10px; display:none; border-left:3px solid transparent; }
  .msg.show{ display:block; }
  .msg.erro{ background:#f7ddd8; color:var(--erro); border-left-color:var(--shu); }
  .msg.ok{ background:#dcefe1; color:var(--ok); border-left-color:var(--ok); }
  .rodape{ margin-top:16px; font-size:12px; color:var(--sumi-2); text-align:center; line-height:1.5; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="marca">
  <div class="selo">忍</div>
  <div class="nome">Shinobi no Sho</div>
  <div class="lema">Fichas, mesa e compêndio da sua campanha</div>
</div>

<div class="card">
  <div class="head">
    <div class="t1">Shinobi no Sho</div>
    <div class="t2">Entrar</div>
  </div>
  <div class="body">
    <div class="tabs">
      <button type="button" class="tab active" id="tab_entrar">Já tenho conta</button>
      <button type="button" class="tab" id="tab_cadastrar">Criar conta</button>
    </div>

    <form id="form_login">
      <label id="lbl_nome" style="display:none;">Seu nome</label>
      <input type="text" id="in_nome" placeholder="Como quer ser chamado na mesa" style="display:none;" autocomplete="nickname">

      <label style="margin-top:0;">E-mail</label>
      <input type="email" id="in_email" required autocomplete="email" autofocus placeholder="voce@email.com">

      <label id="lbl_senha">Senha</label>
      <div class="campo-senha"><input type="password" id="in_senha" required autocomplete="current-password" minlength="6"><button type="button" class="ver-senha" data-alvo="in_senha" aria-label="Mostrar senha">Mostrar</button></div>

      <button type="submit" class="btn" id="btn_enviar">Entrar</button>
      <button type="button" class="link-esqueci" id="btn_esqueci">Esqueci minha senha</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="rodape">Suas fichas ficam salvas na sua conta e aparecem em qualquer aparelho.</div>
  </div>
</div>

<script>
let modo = "entrar"; // "entrar" | "cadastrar" | "recuperar"
const form   = document.getElementById("form_login");
const inNome = document.getElementById("in_nome");
const inEmail= document.getElementById("in_email");
const inSenha= document.getElementById("in_senha");
const btn    = document.getElementById("btn_enviar");
const msg    = document.getElementById("msg");
const tabE   = document.getElementById("tab_entrar");
const tabC   = document.getElementById("tab_cadastrar");

function setModo(m){
  modo = m;
  tabE.classList.toggle("active", m === "entrar" || m === "recuperar");
  tabC.classList.toggle("active", m === "cadastrar");
  inNome.style.display = (m === "cadastrar") ? "" : "none";
  document.getElementById("lbl_nome").style.display = (m === "cadastrar") ? "" : "none";
  document.querySelector(".head .t2").textContent = m === "cadastrar" ? "Criar conta" : (m === "recuperar" ? "Recuperar senha" : "Entrar");
  const recuperar = (m === "recuperar");
  document.getElementById("lbl_senha").style.display = recuperar ? "none" : "";
  inSenha.parentElement.style.display = recuperar ? "none" : "";
  inSenha.required = !recuperar;
  document.getElementById("btn_esqueci").textContent = recuperar ? "Voltar para entrar" : "Esqueci minha senha";
  document.getElementById("btn_esqueci").style.display = (m === "cadastrar") ? "none" : "";
  btn.textContent = (m === "cadastrar") ? "Criar conta" : (recuperar ? "Enviar link para redefinir" : "Entrar");
  esconderMsg();
}
document.getElementById("btn_esqueci").addEventListener("click", () => setModo(modo === "recuperar" ? "entrar" : "recuperar"));
tabE.addEventListener("click", () => setModo("entrar"));
tabC.addEventListener("click", () => setModo("cadastrar"));

function mostrarMsg(texto, tipo){
  msg.textContent = texto;
  msg.className = "msg show " + tipo;
}
function esconderMsg(){ msg.className = "msg"; }

async function jaLogado(){
  const { data } = await sb.auth.getSession();
  if(data.session) location.href = "home.html";
}
jaLogado();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  esconderMsg();
  btn.disabled = true;
  const textoBtn = btn.textContent; btn.textContent = "Aguarde…";
  const email = inEmail.value.trim();
  const senha = inSenha.value;

  try{
    if(modo === "recuperar"){
      if(!email){ mostrarMsg("Digite o e-mail da sua conta.", "erro"); return; }
      const destino = new URL("redefinir.html", location.href).href;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: destino });
      if(error) throw error;
      mostrarMsg("Se esse e-mail tiver conta, chegará um link para criar uma senha nova. Confira também o spam.", "ok");
      return;
    }
    if(modo === "cadastrar"){
      const nome = inNome.value.trim();
      const { data, error } = await sb.auth.signUp({
        email, password: senha,
        options: { data: { nome: nome || email } }
      });
      if(error) throw error;
      if(data.session){
        location.href = "home.html";
      } else {
        mostrarMsg("Conta criada! Verifique seu e-mail para confirmar antes de entrar.", "ok");
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if(error) throw error;
      location.href = "home.html";
    }
  }catch(err){
    mostrarMsg(traduzErro(err.message), "erro");
  }finally{
    btn.disabled = false;
    if(btn.textContent === "Aguarde…") btn.textContent = textoBtn;
  }
});

function traduzErro(m){
  if(!m) return "Não foi possível completar a ação.";
  if(m.indexOf("Invalid login credentials") >= 0) return "E-mail ou senha incorretos.";
  if(m.indexOf("User already registered") >= 0) return "Já existe uma conta com esse e-mail — tente entrar.";
  if(m.indexOf("Password should be") >= 0) return "A senha precisa ter pelo menos 6 caracteres.";
  if(m.indexOf("Email not confirmed") >= 0) return "Confirme seu e-mail antes de entrar (verifique a caixa de entrada).";
  if(m.indexOf("rate limit") >= 0 || m.indexOf("security purposes") >= 0) return "Muitos pedidos seguidos. Espere um minuto e tente de novo.";
  return m;
}

/* mostrar/ocultar senha */
document.querySelectorAll(".ver-senha").forEach(b => b.addEventListener("click", () => {
  const i = document.getElementById(b.dataset.alvo); const mostrar = i.type === "password";
  i.type = mostrar ? "text" : "password"; b.textContent = mostrar ? "Ocultar" : "Mostrar";
  b.setAttribute("aria-label", mostrar ? "Ocultar senha" : "Mostrar senha");
}));
</script>
</body>
</html>
