<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Shinobi no Sho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --bar-bg:#1c1c1e; --bg:#ffffff; --page-bg:#eef0f3;
    --gray-light:#f6f7f8; --gray-text:#8b8d92; --border:#e3e4e7; --border-strong:#d3d5d9;
    --input-bg:#f5f6f7; --input-border:#e2e3e6;
    --shadow: 0 1px 3px rgba(20,20,25,0.06), 0 8px 20px rgba(20,20,25,0.05);
    --radius:14px; --font-display:'Barlow Condensed', Arial, sans-serif; --font-body:'Inter', Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--font-body); background:var(--page-bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .card{
    width:100%; max-width:400px; background:var(--bg); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .head{
    background:var(--bar-bg); color:#fff; padding:22px 24px 18px;
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.5px;
  }
  .head .t1{ font-size:13px; opacity:0.75; font-weight:600; }
  .head .t2{ font-size:24px; font-weight:800; }
  .body{ padding:22px 24px 24px; }
  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    flex:1; padding:9px 10px; text-align:center; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); font-weight:700; font-size:13px; cursor:pointer; font-family:var(--font-body);
  }
  .tab.active{ background:var(--bar-bg); color:#fff; border-color:var(--bar-bg); }
  label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--gray-text); margin:12px 0 6px; }
  input[type=text], input[type=email], input[type=password]{
    width:100%; padding:11px 12px; font-size:14px; font-family:var(--font-body);
    background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; color:var(--ink);
  }
  input:focus{ outline:2px solid var(--bar-bg); outline-offset:-1px; }
  .btn{
    width:100%; margin-top:18px; padding:12px; border:none; border-radius:999px;
    background:var(--bar-bg); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:var(--font-body);
  }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn:hover:not(:disabled){ filter:brightness(1.1); }
  .msg{ margin-top:14px; font-size:12.5px; line-height:1.5; padding:10px 12px; border-radius:8px; display:none; }
  .msg.show{ display:block; }
  .msg.erro{ background:#fdecec; color:#a32020; }
  .msg.ok{ background:#e9f8ef; color:#0f7a3d; }
  .rodape{ margin-top:16px; font-size:11.5px; color:var(--gray-text); text-align:center; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="t1">Shinobi no Sho</div>
    <div class="t2">Entrar</div>
  </div>
  <div class="body">
    <div class="tabs">
      <button type="button" class="tab active" id="tab_entrar">Já tenho conta</button>
      <button type="button" class="tab" id="tab_cadastrar">Criar conta</button>
    </div>

    <form id="form_login">
      <label>Nome (só no cadastro)</label>
      <input type="text" id="in_nome" placeholder="Como quer ser chamado" style="display:none;">

      <label style="margin-top:0;">E-mail</label>
      <input type="email" id="in_email" required autocomplete="email">

      <label>Senha</label>
      <input type="password" id="in_senha" required autocomplete="current-password" minlength="6">

      <button type="submit" class="btn" id="btn_enviar">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="rodape">Suas fichas ficam salvas na sua conta e sincronizam entre dispositivos.</div>
  </div>
</div>

<script>
let modo = "entrar"; // "entrar" | "cadastrar"
const form   = document.getElementById("form_login");
const inNome = document.getElementById("in_nome");
const inEmail= document.getElementById("in_email");
const inSenha= document.getElementById("in_senha");
const btn    = document.getElementById("btn_enviar");
const msg    = document.getElementById("msg");
const tabE   = document.getElementById("tab_entrar");
const tabC   = document.getElementById("tab_cadastrar");

function setModo(m){
  modo = m;
  tabE.classList.toggle("active", m === "entrar");
  tabC.classList.toggle("active", m === "cadastrar");
  inNome.style.display = (m === "cadastrar") ? "" : "none";
  btn.textContent = (m === "cadastrar") ? "Criar conta" : "Entrar";
  esconderMsg();
}
tabE.addEventListener("click", () => setModo("entrar"));
tabC.addEventListener("click", () => setModo("cadastrar"));

function mostrarMsg(texto, tipo){
  msg.textContent = texto;
  msg.className = "msg show " + tipo;
}
function esconderMsg(){ msg.className = "msg"; }

async function jaLogado(){
  const { data } = await sb.auth.getSession();
  if(data.session) location.href = "home.html";
}
jaLogado();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  esconderMsg();
  btn.disabled = true;
  const email = inEmail.value.trim();
  const senha = inSenha.value;

  try{
    if(modo === "cadastrar"){
      const nome = inNome.value.trim();
      const { data, error } = await sb.auth.signUp({
        email, password: senha,
        options: { data: { nome: nome || email } }
      });
      if(error) throw error;
      if(data.session){
        location.href = "home.html";
      } else {
        mostrarMsg("Conta criada! Verifique seu e-mail para confirmar antes de entrar.", "ok");
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if(error) throw error;
      location.href = "home.html";
    }
  }catch(err){
    mostrarMsg(traduzErro(err.message), "erro");
  }finally{
    btn.disabled = false;
  }
});

function traduzErro(m){
  if(!m) return "Não foi possível completar a ação.";
  if(m.indexOf("Invalid login credentials") >= 0) return "E-mail ou senha incorretos.";
  if(m.indexOf("User already registered") >= 0) return "Já existe uma conta com esse e-mail — tente entrar.";
  if(m.indexOf("Password should be") >= 0) return "A senha precisa ter pelo menos 6 caracteres.";
  if(m.indexOf("Email not confirmed") >= 0) return "Confirme seu e-mail antes de entrar (verifique a caixa de entrada).";
  return m;
}
</script>
</body>
</html>
